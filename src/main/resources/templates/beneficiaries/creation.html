<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(#{website.name})}"></head>

<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<main class="container py-4">
    <div>
        <div th:if="${submitState} != null">
            <div th:if="${submitState} == 'success'">
                <div th:replace="~{common/modal-creation :: modal-success}"></div>
            </div>
            <div th:unless="${submitState} == 'success'">
                <div th:replace="~{common/modal-creation :: modal-error}"></div>
            </div>
        </div>
    </div>

    <div class="card border-0 rounded-4 shadow-sm">
        <div class="card-header rounded-top-4 bg-primary text-white p-3">
            <h1 class="h3 mb-0 py-1"><i class="bi bi-person-fill-add me-2"></i>Créer un bénéficiaire</h1>
        </div>

        <div>
            <form name="creation-user" id="creation-interpreter" class="p-2" th:action="@{/beneficiaires/creer}"
                  th:object="${beneficiaryForm}" method="post">
                <div class="d-flex flex-column align-items-center">
                    <div class="d-flex flex-column flex-lg-row col-8">
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="lastname">Nom&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                            <input class="col-7 ms-2" type="text" name="lastname" id="lastname" th:field="*{lastName}" required />
                        </div>
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="firstname">Prénom&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                            <input class="col-7 ms-2" type="text" name="firstname" id="firstname" th:field="*{firstName}" required />
                        </div>
                    </div>
                    <div class="d-flex flex-column flex-lg-row col-8">
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="email"><i class="bi bi-envelope-fill me-2"></i>Mail&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                            <input class="col-7 ms-2" type="email" name="email" id="email" th:field="*{email}" required />
                        </div>
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="phone"><i class="bi bi-telephone-fill me-2"></i>Téléphone&nbsp;: </label>
                            <input class="col-7 ms-2" type="tel" name="phone" id="phone"
                                   pattern="[0-9]+\/[0-9]+\.[0-9]+\.[0-9]+" placeholder="xxxx/xx.xx.xx" th:field="*{phoneNumber}" />
                        </div>
                    </div>
                    <div class="d-flex flex-column flex-lg-row col-8">
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="password">Mot de passe&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                            <input class="col-7 ms-2" type="password" name="password" id="password" autocomplete="new-password" th:field="*{password}" minlength="6" required />
                        </div>
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="birthdate"><i class="bi bi-cake2-fill me-2"></i>Naissance&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                            <input class="col-7 ms-2" type="date" name="birthdate" id="birthdate" th:field="*{birthDate}" required />
                        </div>
                    </div>
                </div>

                <hr>
                <div>
                    <div class="d-flex flex-column align-items-center">
                        <div class="d-flex flex-column flex-lg-row col-8">
                            <div class="d-flex justify-content-end m-2 col-lg-6">
                                <div class="m-2">
                                    <label for="statusId">Statut&nbsp;<p class="d-inline text-danger">*</p>&nbsp;: </label>
                                    <select name="statusId" id="statusId" required>
                                        <option value="">-- Sélectionner --</option>
                                        <option th:each="status : ${allStatuses}"
                                                th:value="${status.id}"
                                                th:text="${status.designation}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end m-2 col-lg-6">
                                <div class="m-2">
                                    <label for="interpreterRefId">Interprète de référence&nbsp;<p class="d-inline text-danger">*</p>&nbsp;: </label>
                                    <select name="interpreterRefId" id="interpreterRefId" required>
                                        <option value="">-- Sélectionner --</option>
                                        <option th:each="interpreter : ${allInterpreters}"
                                                th:value="${interpreter.id}"
                                                th:text="${interpreter.firstName + ' ' + interpreter.lastName + ' (' + interpreter.login + ')'}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <hr>
                <div class="d-grid d-md-flex justify-content-md-center gap-2">
                    <button type="submit" class="btn btn-primary btn-lg"><i class="bi-floppy-fill me-2"></i>Créer</button>
                    <a th:href="@{/beneficiaires}"
                       class="btn btn-outline-secondary btn-lg">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</main>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
