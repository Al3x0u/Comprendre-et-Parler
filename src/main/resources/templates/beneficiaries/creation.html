<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(#{website.name})}"></head>

<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<main class="container py-4">
    <div th:if="${submitState != null}">
        <div th:if="${submitState == 'success'}">
            <div th:replace="~{common/modals :: modal-success}"></div>
        </div>
        <div th:unless="${submitState  == 'success'}">
            <div th:replace="~{common/modals :: modal-error(${submitState})}"></div>
        </div>
    </div>

    <div class="card border-0 rounded-4 shadow-sm">
        <div class="card-header rounded-top-4 bg-primary text-white p-3">
            <h1 class="h3 mb-0 py-1"><i class="bi bi-person-fill-add me-2"></i>Créer un bénéficiaire</h1>
        </div>

        <div class="card-body p-5">
            <form name="creation-user" id="creation-beneficiary" th:action="@{/beneficiaires/creer}"
                  th:object="${beneficiaryForm}" method="post">

                <!-- Last name / First name -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="lastname" class="form-label">Nom&nbsp;<span class="text-danger">*</span></label>
                        <input id="lastname" type="text" class="form-control" name="lastname" th:field="*{lastName}" required />
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="firstname" class="form-label">Prénom&nbsp;<span class="text-danger">*</span></label>
                        <input id="firstname" type="text" class="form-control" name="firstname" th:field="*{firstName}" required />
                    </div>
                </div>

                <!-- Email / Phone -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="email" class="form-label"><i class="bi bi-envelope-fill me-2"></i>Mail&nbsp;<span class="text-danger">*</span></label>
                        <input id="email" type="email" class="form-control" name="email" th:field="*{email}" required />
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="phone" class="form-label"><i class="bi bi-telephone-fill me-2"></i>Téléphone</label>
                        <input id="phone" type="tel" class="form-control" name="phone"
                               pattern="[0-9]+\/[0-9]+\.[0-9]+\.[0-9]+" placeholder="xxxx/xx.xx.xx" th:field="*{phoneNumber}" />
                    </div>
                </div>

                <!-- Password / BirthDate -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="password" class="form-label"><i class="bi bi-lock-fill me-2"></i>Mot de passe&nbsp;<span class="text-danger">*</span></label>
                        <div class="position-relative">
                            <input id="password" type="password" class="form-control pe-5" name="password" autocomplete="new-password" th:field="*{password}" minlength="6" required />
                            <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted toggle-password"
                               data-target="password" style="cursor: pointer;"></i>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="birthdate" class="form-label"><i class="bi bi-cake2-fill me-2"></i>Naissance&nbsp;<span class="text-danger">*</span></label>
                        <input id="birthdate" type="date" class="form-control" name="birthdate" th:value="*{birthDate != null}? *{birthDate} : ''"
                               th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required />
                    </div>
                </div>

                <hr class="my-4">

                <!-- Status / Reference interpreter -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="statusId" class="form-label">Statut&nbsp;<span class="text-danger">*</span></label>
                        <select id="statusId" class="form-select" name="statusId" required>
                            <option th:if="*{statusId == 0}" value="">-- Sélectionner --</option>
                            <option th:each="status : ${allStatuses}"
                                    th:value="${status.id}"
                                    th:text="${status.designation}"
                                    th:selected="${status.id == beneficiaryForm.statusId}">

                            </option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="interpreterRefId" class="form-label">Interprète de référence&nbsp;<span class="text-danger">*</span></label>
                        <select id="interpreterRefId" class="form-select" name="interpreterRefId" required>
                            <option th:if="*{interpreterRefId == 0}" value="">-- Sélectionner --</option>
                            <option th:each="interpreter : ${allInterpreters}"
                                    th:value="${interpreter.id}"
                                    th:text="${interpreter.firstName + ' ' + interpreter.lastName + ' (' + interpreter.login + ')'}"
                                    th:selected="${interpreter.id == beneficiaryForm.interpreterRefId}">
                            </option>
                        </select>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-grid d-md-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-lg"><i class="bi-floppy-fill me-2"></i>Créer</button>
                    <a th:href="@{/beneficiaires}" class="btn btn-outline-secondary btn-lg">Annuler</a>
                </div>

            </form>
        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
