<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(#{website.name})}"></head>
<body>

<div th:replace="~{common/navbar :: navbar}"></div>

<main class="container py-4 md-5">

    <div class="mb-3">
        <a th:if="${fromInterpreter != null}"
           th:href="@{/interpretes/profil/{id}(id=${fromInterpreter})}"
           class="btn btn-outline-secondary btn-lg">
            <i class="bi bi-arrow-left me-2"></i>Retour au profil
        </a>
        <a th:unless="${fromInterpreter != null}"
           th:href="@{/beneficiaires}"
           class="btn btn-outline-secondary btn-lg">
            <i class="bi bi-arrow-left me-2"></i>Retour à la liste
        </a>
    </div>

    <!-- Profile Header -->
    <div class="card border-0 shadow-sm mb-4 rounded-4" th:object="${beneficiaire}">
        <div class="card-body bg-primary text-white rounded-4 p-4 md-5">
            <div class="row align-items-center g-4">

                <div class="col-12 col-md-auto text-center">
                    <img th:src="@{/images/avatar_01.png}" alt="Avatar bénéficiaire" class="profile-avatar rounded-circle border border-4 border-white shadow">
                </div>

                <div class="col-12 col-md">
                    <p class="text-white-50 mb-1">Profil bénéficiaire</p>
                    <h1 class="h2 mb-1 me-2" th:text="*{firstName + ' ' + lastName}"></h1>
                    <div class="d-flex">
                        <p class="fw-semibold mb-1 me-3" th:text="*{login}"></p>
                        <span class="text-white-50" th:text="${age} + ' ans'"></span>
                    </div>


                    <div class="d-grid d-md-flex gap-2">
                        <a th:href="@{/beneficiaires/profil/{id}/modifier(id=${beneficiaire.id})}" class="btn btn-light btn-lg text-primary fw-semibold">
                            <i class="bi bi-pencil-fill me-2"></i>Modifier le profil
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="row g-4" th:object="${beneficiaire}">

        <div class="col-12 col-lg-8">

            <!-- Contact -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <h2 class="h5 text-primary mb-4">Informations de contact</h2>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <div class="bg-light rounded p-3 h-100">
                                <p class="text-secondary fw-bold small mb-1"><i class="bi bi-envelope-fill me-2"></i>Adresse mail</p>
                                <p class="mb-0" th:text="*{email}"></p>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="bg-light rounded p-3 h-100">
                                <p class="text-secondary fw-bold small mb-1"><i class="bi bi-telephone-fill me-2"></i>Téléphone</p>
                                <p class="mb-0" th:text="*{phoneNumber}"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Referent Interpreter -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="h5 text-primary mb-0">Interprète de référence</h2>
                        <button class="btn btn-outline-primary btn-sm rounded-4" id="btn-edit-interpreter" onclick="toggleEditInterpreter()">
                            <i class="bi bi-pencil me-1"></i>Modifier
                        </button>
                    </div>

                    <!-- Vue normale -->
                    <div id="interpreter-view" th:if="*{interpreterRef != null}" class="bg-light rounded p-3 d-flex align-items-center gap-3">
                        <a th:href="@{/interpretes/profil/{id}(id=${beneficiaire.interpreterRef.id}, fromBeneficiary=${beneficiaire.id})}">
                            <img th:src="@{/images/avatar.png}" alt="Avatar" width="40" height="40" class="rounded-circle border">
                        </a>
                        <div>
                            <a th:href="@{/interpretes/profil/{id}(id=${beneficiaire.interpreterRef.id}, fromBeneficiary=${beneficiaire.id})}"
                               class="fw-semibold text-primary text-decoration-none"
                               th:text="*{interpreterRef.firstName + ' ' + interpreterRef.lastName}"></a>
                            <p class="text-muted small mb-0" th:text="*{interpreterRef.login}"></p>
                        </div>
                    </div>

                    <!-- Vue édition -->
                    <div id="interpreter-edit" class="d-none">
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary dropdown-toggle w-100 d-flex align-items-center gap-2"
                                    type="button" id="interpreter-dropdown" data-bs-toggle="dropdown">
                                <img src="/images/avatar.png" width="30" height="30" class="rounded-circle border" id="selected-avatar">
                                <span id="selected-name">Choisir un interprète</span>
                            </button>
                            <ul class="dropdown-menu w-100" style="max-height: 300px; overflow-y: auto;">
                                <li th:each="i : ${interpreters}">
                                    <a class="dropdown-item d-flex align-items-center gap-3 py-2 interpreter-option"
                                       href="#"
                                       th:data-name="${i.firstName + ' ' + i.lastName}"
                                       th:data-id="${i.id}">
                                        <img th:src="@{/images/avatar.png}" width="35" height="35" class="rounded-circle border">
                                        <div>
                                            <p class="fw-semibold mb-0" th:text="${i.firstName + ' ' + i.lastName}"></p>
                                            <p class="text-muted small mb-0" th:text="${i.login}"></p>
                                        </div>
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <input type="hidden" id="selected-interpreter-id" name="interpreterRefId">
                    </div>

                    <p th:unless="*{interpreterRef != null}" class="text-muted mb-0">Aucun interprète assigné</p>
                </div>
            </div>

        </div>

        <div class="col-12 col-lg-4">

            <!-- Status -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="h5 text-primary mb-0">Statut</h2>
                        <button class="btn btn-outline-primary btn-sm rounded-4" id="btn-edit-status" onclick="toggleEditStatus()">
                            <i class="bi bi-pencil me-1"></i>Modifier
                        </button>
                    </div>

                    <!-- Vue normale -->
                    <div id="status-view" class="bg-light rounded p-3">
                        <p class="fw-semibold mb-1" th:text="*{status.designation}"></p>
                        <p class="text-muted small mb-0" th:text="'Quota : ' + *{status.hourQuota} + 'h/an'"></p>
                    </div>

                    <!-- Vue édition -->
                    <div id="status-edit" class="d-none">
                        <select class="form-select">
                            <option value="Etudiant">Etudiant</option>
                            <option value="Travailleur">Travailleur</option>
                            <option value="Demandeur d'emploi">Demandeur d'emploi</option>
                            <option value="Autre">Autre</option>
                        </select>
                    </div>

                </div>
            </div>

        </div>

    </div>

</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
    function toggleEditInterpreter() {
        const btn = document.getElementById('btn-edit-interpreter');
        const view = document.getElementById('interpreter-view');
        const edit = document.getElementById('interpreter-edit');
        const isEditing = btn.classList.contains('editing');

        if (isEditing) {
            btn.innerHTML = '<i class="bi bi-pencil me-1"></i>Modifier';
            btn.classList.remove('editing', 'btn-outline-success');
            btn.classList.add('btn-outline-primary');
            view.classList.remove('d-none');
            edit.classList.add('d-none');
        } else {
            btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>Terminer';
            btn.classList.add('editing', 'btn-outline-success');
            btn.classList.remove('btn-outline-primary');
            view.classList.add('d-none');
            edit.classList.remove('d-none');
        }
    }

    function toggleEditStatus() {
        const btn = document.getElementById('btn-edit-status');
        const view = document.getElementById('status-view');
        const edit = document.getElementById('status-edit');
        const isEditing = btn.classList.contains('editing');

        if (isEditing) {
            btn.innerHTML = '<i class="bi bi-pencil me-1"></i>Modifier';
            btn.classList.remove('editing', 'btn-outline-success');
            btn.classList.add('btn-outline-primary');
            view.classList.remove('d-none');
            edit.classList.add('d-none');
        } else {
            btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>Terminer';
            btn.classList.add('editing', 'btn-outline-success');
            btn.classList.remove('btn-outline-primary');
            view.classList.add('d-none');
            edit.classList.remove('d-none');
        }
    }

    document.querySelectorAll('.interpreter-option').forEach(el => {
        el.addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('selected-name').textContent = el.dataset.name;
            document.getElementById('selected-interpreter-id').value = el.dataset.id;
            const dropdown = bootstrap.Dropdown.getInstance(document.getElementById('interpreter-dropdown'));
            dropdown.hide();
        });
    });
</script>
</body>
</html>
