<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(#{website.name})}"></head>
<body>

<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>

<!-- Filters : just visual -->
<div id="dropdown-filtre" class="dropdown-menu">
    <!-- By user (only for Manager) -->
    <th:block th:if="${userRole == 'MANAGER'}">
        <h6 class="dropdown-header">Par utilisateur</h6>
        <div class="px-3 pb-2">
            <input type="text" id="search-interpreter" class="form-control form-control-sm"
                   placeholder="Rechercher un utilisateur...">
        </div>
        <div id="interpreter-list">
            <a class="dropdown-item filter-interpreter" href="#" data-value="Jessica DuBuisson">
                <i class="bi bi-person me-2"></i>J. DuBuisson
            </a>
            <a class="dropdown-item filter-interpreter" href="#" data-value="Alice Charpentier">
                <i class="bi bi-person me-2"></i>A. Charpentier
            </a>
        </div>
        <hr class="dropdown-divider">
    </th:block>

    <!-- By status -->
    <h6 class="dropdown-header">Par statut</h6>
    <a class="dropdown-item d-flex align-items-center gap-2 filter-status" href="#" data-value="Acceptée">
        <div style="width:12px;height:12px;background:#40c057;border-radius:3px"></div>Acceptée
    </a>
    <a class="dropdown-item d-flex align-items-center gap-2 filter-status" href="#" data-value="En attente">
        <div style="width:12px;height:12px;background:#fab005;border-radius:3px"></div>En attente
    </a>
    <a class="dropdown-item d-flex align-items-center gap-2 filter-status" href="#" data-value="Refusée">
        <div style="width:12px;height:12px;background:#fa5252;border-radius:3px"></div>Refusée/Annulée
    </a>
    <a class="dropdown-item d-flex align-items-center gap-2 filter-status" href="#" data-value="Horaire de base">
        <div style="width:12px;height:12px;background:#4dabf7;border-radius:3px"></div>Horaire de base
    </a>
</div>

<!-- Calendar-->
<div class="px-4 mt-4 mb-1">
    <div id="calendar"></div>
</div>

<!-- Legend -->
<div class="d-flex justify-content-center gap-5 py-3 legende">
    <div class="d-flex align-items-center gap-2">
        <div class="legende-dot legende-dot-accepted"></div>
        <span>Demande acceptée</span>
    </div>
    <div class="d-flex align-items-center gap-2">
        <div class="legende-dot legende-dot-pending"></div>
        <span>Demande en attente</span>
    </div>
    <div class="d-flex align-items-center gap-2">
        <div class="legende-dot legende-dot-refused"></div>
        <span>Demande refusée/annulée</span>
    </div>
    <div class="d-flex align-items-center gap-2">
        <div class="legende-dot legende-dot-base"></div>
        <span>Horaire de base</span>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/fullcalendar.min.js}"></script>
<script th:inline="javascript">
    const allEvents = JSON.parse(/*[[${events}]]*/ '[]');
    const userRole = /*[[${userRole}]]*/ 'MANAGER';

    const customButtons = {
        filterBtn: {
            text: 'Filtre ▾',
            click: function() {
                const btn = document.querySelector('.fc-filterBtn-button');
                const rect = btn.getBoundingClientRect();
                const dropdown = document.getElementById('dropdown-filtre');

                dropdown.style.cssText = ` position: fixed !important; top: ${rect.top + rect.height}px !important; left: ${rect.left}px !important; z-index: 9999 !important;`;

                dropdown.classList.toggle('show');
                btn.classList.toggle('active');
            }
        }
    };

    if (userRole === 'BENEFICIARY') {
        customButtons.newRequest = {
            text: '+ Nouvelle demande',
            click: function() {
                // TODO: ouvrir modal de création
            }
        };
    }

    if (userRole === 'INTERPRETER') {
        customButtons.newUnavailability = {
            text: '+ Nouvelle indisponibilité',
            click: function() {
                // TODO: ouvrir modal de création
            }
        };
    }

    if (userRole === 'MANAGER') {
        customButtons.newUnavailability = {
            text: '+ Nouvelle indisponibilité',
            click: function() {
                // TODO: ouvrir modal de création
            }
        };
        customButtons.newMission = {
            text: '+ Nouvelle mission',
            click: function () {
                // TODO: ouvrir modal de création
            }
        };
    }

    document.addEventListener('DOMContentLoaded', function() {
        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'timeGridWeek',
            height: '83vh',
            locale: 'fr',
            firstDay: 1,
            weekends: true,
            allDaySlot: false,
            businessHours: {
                daysOfWeek: [ 1, 2, 3, 4, 5 ], // Monday - Thursday
                startTime: '00:00',
                endTime: '23:59',
            },
            slotDuration: '00:30:00',
            slotMinTime: '08:00:00',
            slotMaxTime: '22:00:00',
            expandRows: true,
            events: allEvents,
            customButtons: customButtons,
            headerToolbar: {
                start: 'timeGridWeek,timeGridDay filterBtn',
                center: 'prev title next',
                end: userRole === 'MANAGER' ? 'newUnavailability newMission today'
                    : userRole === 'INTERPRETER' ? 'newUnavailability today'
                        : 'newRequest today'
            },
            buttonText: {
                week: 'Semaine',
                day: 'Jour',
                today: 'Aujourd\'hui'
            },
            eventContent: function(arg) {
                const props = arg.event.extendedProps;
                return {
                    html: `
                        <div class="fc-event-content-inner p-1">
                            <div class="fw-bold">${arg.event.title}</div>
                            <div>${arg.timeText}</div>
                            <div>${props.type || ''}</div>
                            <div><i class="bi bi-pin-map-fill"></i> ${props.room || ''}</div>
                        </div>
                    `
                };
            },

            eventClick: function(info) {
                const event = info.event;
                const props = event.extendedProps;

                document.getElementById('modalTitle').innerText = event.title || '';
                document.getElementById('modalTime').innerText = info.timeText || '';
                document.getElementById('modalDate').innerText = event.start ? event.start.toLocaleDateString('fr-BE') : '';
                document.getElementById('modalType').innerText = props.type || '';
                document.getElementById('modalLocation').innerText = props.room || '';
                document.getElementById('modalBeneficiary').innerText = props.beneficiary || '';
                document.getElementById('modalComment').innerText = props.comment || '';
                document.getElementById('modalStatus').innerText = props.status || '';

                document.getElementById('modalInterpreter').innerText = props.interpreter || 'Aucun interprète';
                const modal = new bootstrap.Modal(document.getElementById('eventModal'));
                modal.show();
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.fc-filterBtn-button') && !e.target.closest('#dropdown-filtre')) {
                document.getElementById('dropdown-filtre').classList.remove('show');
                document.querySelector('.fc-filterBtn-button').classList.remove('active');
            }
        });

        document.getElementById('search-interpreter')?.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#interpreter-list .filter-interpreter').forEach(item => {
                const name = item.dataset.value.toLowerCase();
                item.style.display = name.includes(query) ? '' : 'none';
            });
        });

        document.getElementById('search-interpreter')?.addEventListener('click', function(e) {
            e.stopPropagation();
        });

        calendar.render();
    });
</script>

<div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">

            <!-- Header -->
            <div class="modal-header border-0">
                <h4 class="modal-title fw-bold" id="modalTitle"></h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>

            <!-- Body -->
            <div class="modal-body">

                <div class="mb-2">
                    <i class="bi bi-calendar"></i>
                    <span id="modalDate"></span>
                    <i class="bi bi-clock ms-2"></i>
                    <span id="modalTime"></span>
                </div>

                <div class="mb-2">
                    <i class="bi bi-geo-alt"></i>
                    <span id="modalLocation"></span>
                </div>

                <div class="mb-2">
                    <strong>Bénéficiaire - </strong>
                    <span id="modalBeneficiary" class="fst-italic text-muted"></span>
                </div>

                <div class="mb-2" id="modalType"></div>

                <div class="mb-2">
                    <strong>Commentaire :</strong>
                    <span id="modalComment" class="fst-italic text-muted"></span>
                </div>

                <div class="mb-2">
                    <strong>Statut :</strong>
                    <span id="modalStatus"></span>
                </div>

                <div class="mb-2">
                    <strong>Interprète :</strong>
                    <span id="modalInterpreter" class="fst-italic text-muted"></span>
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
