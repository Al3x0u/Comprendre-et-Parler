<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/head :: head(#{website.name})}"></th:block>
</head>
<body>
<div class="d-flex flex-column flex-wrap align-items-center container" style="margin-top: 10vh;">
    <img th:src="#{website.logo}" alt="Logo" width="120" class="mb-1">
    <h1 class="fw-bold text-primary mb-1" th:text="#{website.name}"></h1>
    <p class="text-primary fst-italic mb-4">Réinitialisation du mot de passe</p>

    <p th:if="${info}" th:text="${info}" class="text-success"></p>
    <p th:if="${error}" th:text="${error}" class="text-danger"></p>

    <div class="d-flex flex-column form-login rounded-4 p-4 p-md-5 w-100 shadow">
        <form method="post" th:action="@{/mot-de-passe-oublie}">
            <p class="text-muted small mb-3">Entrez l'adresse email associée à votre compte. Si elle existe, vous recevrez un lien valable 10 minutes.</p>
            <div class="mb-4">
                <label class="form-label text-muted">Email</label>
                <input type="email" name="email" class="form-control rounded" placeholder="Entrez votre email" required autofocus/>
            </div>
            <div class="d-grid mb-2">
                <button type="submit" class="btn btn-primary rounded">Envoyer le lien</button>
            </div>
            <a th:href="@{/login}" class="text-decoration-underline text-muted small">Retour à la connexion</a>
        </form>
    </div>
</div>
</body>
</html>
