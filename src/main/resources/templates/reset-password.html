<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{website.name}"></title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex flex-column flex-wrap align-items-center container" style="margin-top: 10vh;">
    <img th:src="#{website.logo}" alt="Logo" width="120" class="mb-1">
    <h1 class="fw-bold text-primary mb-1" th:text="#{website.name}"></h1>
    <p class="text-primary fst-italic mb-4">Choisissez un nouveau mot de passe</p>

    <p th:if="${resetError}" th:text="${resetError}" class="text-danger"></p>

    <div class="d-flex flex-column form-login rounded-4 p-4 p-md-5 w-100 shadow">
        <form method="post" th:action="@{/reinitialiser}">
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="mb-4">
                <label class="form-label text-muted">Nouveau mot de passe</label>
                <input type="password" name="newPassword" class="form-control rounded" required autofocus/>
            </div>
            <div class="mb-5">
                <label class="form-label text-muted">Confirmer le mot de passe</label>
                <input type="password" name="confirmPassword" class="form-control rounded" required/>
            </div>
            <div class="d-grid mb-2">
                <button type="submit" class="btn btn-primary rounded">Réinitialiser</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
