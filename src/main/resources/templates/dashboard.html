<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(#{website.name})}"></head>
<body class="vh-100">
<div th:replace="~{common/navbar :: navbar}"></div>

<h2 class="text-center mt-5 mb-5" th:text="'Bonjour ' + ${user.FirstName} + ' !'"></h2>

<div class="dashboard-grid">

    <!-- Card Horaire -->
    <a th:href="@{/horaire}" class="text-decoration-none text-dark">
        <div class="card border-0 rounded-4 overflow-hidden h-100 shadow-sm">
            <div class="card-header-colored bg-schedule d-flex align-items-center justify-content-center py-4">
                <i class="bi bi-clock fs-1 text-white"></i>
            </div>
            <div class="card-body text-center">
                <h5 class="fw-bold dashboard-card-title">Horaire</h5>
                <p class="text-muted dashboard-card-subtitle">Page de gestion des horaires</p>
            </div>
        </div>
    </a>

    <!-- Card Interprètes -->
    <a th:href="@{/interpretes}" class="text-decoration-none text-dark">
        <div class="card border-0 rounded-4 overflow-hidden h-100 shadow-sm">
            <div class="card-header-colored bg-schedule d-flex align-items-center justify-content-center py-4">
                <i class="bi bi-person-fill fs-1 text-white"></i>
            </div>
            <div class="card-body text-center">
                <h5 class="fw-bold dashboard-card-title">Interprètes</h5>
                <p class="text-muted dashboard-card-subtitle">Page de gestion des interprètes</p>
                <p class="fw-bold dashboard-card-title" th:text="${interpreterCount}"></p>
            </div>
        </div>
    </a>

    <!-- Card Bénéficiaires -->
    <a th:href="@{/beneficiaires}" class="text-decoration-none text-dark">
        <div class="card border-0 rounded-4 overflow-hidden h-100 shadow-sm">
            <div class="card-header-colored bg-schedule d-flex align-items-center justify-content-center py-4">
                <i class="bi bi-mortarboard-fill fs-1 text-white"></i>
            </div>
            <div class="card-body text-center">
                <h5 class="fw-bold dashboard-card-title">Bénéficiaires</h5>
                <p class="text-muted dashboard-card-subtitle">Page de gestion des bénéficiaires</p>
                <p class="fw-bold dashboard-card-title" th:text="${beneficiaryCount}"></p>
            </div>
        </div>
    </a>
</div>

<!-- Bundle Bootstrap JS -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
