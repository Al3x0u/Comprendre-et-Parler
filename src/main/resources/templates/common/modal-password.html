<th:block th:fragment="modal-password(actionUrl, autoShow)">
    <div class="modal fade" id="modalPassword" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" th:attr="data-autoshow=${autoShow}">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header bg-primary text-white rounded-top-4">
                    <h5 class="modal-title"><i class="bi bi-lock-fill me-2"></i>Modifier le mot de passe</h5>
                </div>
                <div class="modal-body px-4">
                    <div id="password-error" class="alert alert-danger d-none" role="alert"></div>
                    <form id="form-password" th:action="${actionUrl}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Mot de passe actuel</label>
                            <input id="currentPassword" type="password" class="form-control" name="currentPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Nouveau mot de passe</label>
                            <input id="newPassword" type="password" class="form-control" name="newPassword" required minlength="6">
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                            <input id="confirmPassword" type="password" class="form-control" name="confirmPassword" required minlength="6">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" id="btn-save-password" class="btn btn-primary"><i class="bi bi-floppy-fill me-2"></i>Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const modalElement = document.getElementById("modalPassword");
            if (modalElement?.dataset.autoshow === 'true') {
                new bootstrap.Modal(modalElement, { backdrop: 'static', keyboard: false }).show();
            }

            modalElement?.addEventListener('hidden.bs.modal', () => {
                document.getElementById("form-password").reset();
                showError(null);
            });

            document.getElementById("btn-save-password")?.addEventListener("click", () => {
                const current     = document.getElementById("currentPassword").value.trim();
                const newPwd      = document.getElementById("newPassword").value.trim();
                const confirmPwd  = document.getElementById("confirmPassword").value.trim();

                if (!current || !newPwd || !confirmPwd) {
                    return showError("Veuillez remplir tous les champs.");
                }

                if (newPwd.length < 6) {
                    return showError("Le nouveau mot de passe doit contenir au moins 6 caractères.");
                }

                if (newPwd === current) {
                    return showError("Le nouveau mot de passe doit être différent de l'ancien.");
                }

                if (newPwd !== confirmPwd) {
                    return showError("Les mots de passe ne correspondent pas.");
                }

                showError(null);
                document.getElementById("form-password").submit();
            });

            function showError(message) {
                const box = document.getElementById("password-error");
                if (message) {
                    box.textContent = message;
                    box.classList.remove("d-none");
                } else {
                    box.textContent = "";
                    box.classList.add("d-none");
                }
            }
        });
    </script>
</th:block>
