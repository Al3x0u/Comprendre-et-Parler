<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div th:if="${mustChangePassword}">
        <div th:replace="~{common/modals :: modal-password(@{/profil/modifier-mot-de-passe}, ${mustChangePassword})}"></div>
    </div>

    <div class="container-fluid px-4">
        <a class="navbar-brand" th:href="${isManager} ? '/dashboard' : '/profil'">
            <img src="/images/app_logo.png" alt="Logo" width="40">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav align-items-center gap-3">

                <!-- Dashboard (Manager only) -->
                <li class="nav-item" th:if="${isManager}">
                    <a class="nav-link" th:href="@{/dashboard}"
                       th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">
                        Dashboard
                    </a>
                </li>

                <!-- Schedule -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/horaire}"
                       th:classappend="${currentPage == 'schedule'} ? 'active' : ''">
                        Horaire
                    </a>
                </li>

                <li class="nav-item" th:if="${isManager}">
                    <a class="nav-link" th:href="@{/gestion}"
                       th:classappend="${currentPage == 'gestion'} ? 'active' : ''">
                        Gestion
                    </a>
                </li>

                <!-- Interpreters List (Manager only) -->
                <li class="nav-item" th:if="${isManager}">
                    <a class="nav-link" th:href="@{/interpretes}"
                       th:classappend="${currentPage == 'interpreters'} ? 'active' : ''">
                        Interprètes
                    </a>
                </li>

                <!-- Beneficiaries List (Manager only) -->
                <li class="nav-item" th:if="${isManager}">
                    <a class="nav-link" th:href="@{/beneficiaires}"
                       th:classappend="${currentPage == 'beneficiaries'} ? 'active' : ''">
                        Bénéficiaires
                    </a>
                </li>

                <!-- Dropdown profil -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle profile-name d-flex align-items-center gap-2"
                       href="#" role="button" data-bs-toggle="dropdown">
                        <span th:text="${session.user.firstName + ' ' + session.user.lastName}"
                              th:classappend="${currentPage == 'profile'} ? 'active-profile' : ''"></span>
                        <img src="/images/avatar.png" alt="Profil" width="35" class="rounded-circle border">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" th:href="@{/profil}">
                                <i class="bi bi-person me-2"></i>Mon profil
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item text-danger" th:href="@{/logout}">
                                <i class="bi bi-box-arrow-right me-2"></i>Se déconnecter
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
