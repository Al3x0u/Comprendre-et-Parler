<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container-fluid px-4">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <img src="/images/app_logo.png" alt="Logo" width="40">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav align-items-center gap-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"
                       th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/schedule}"
                       th:classappend="${currentPage == 'schedule'} ? 'active' : ''">
                        Horaire
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/interpreters}"
                       th:classappend="${currentPage == 'interpreters'} ? 'active' : ''">
                        Interprètes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/beneficiaries}"
                       th:classappend="${currentPage == 'beneficiaries'} ? 'active' : ''">
                        Etudiants
                    </a>
                </li>
                <li class="nav-item">
                    <a class="profile-name nav-link" th:href="@{/profile}">Isabelle Hulin</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/profile}">
                        <img src="/images/avatar.png" alt="Profil" width="35" class="rounded-circle border border-black border-1">
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
