<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="modal-success">
    <div class="modal fade" id="modalCredentials" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <form th:action="@{/interpretes/creer/notifier}" th:object="${newUser}"
                  method="post" class="modal-content border-0 rounded-4">
                <input type="hidden" th:field="*{password}">
                <input type="hidden" th:field="*{firstName}">
                <input type="hidden" th:field="*{email}">
                <input type="hidden" th:field="*{login}">
                <div class="modal-header text-bg-success rounded-top-4">
                    <h3 class="modal-title"><i class="bi bi-check-circle me-2"></i>Utilisateur créé avec succès</h3>
                </div>
                <div class="modal-body p-3">
                    <h4>L'utilisateur <span th:text="*{firstName}"></span> a été créé avec le login <span th:text="*{login}"></span> !</h4>
                    <h5>Un mail va être envoyé à l'adresse <span th:text="*{email}"></span></h5>
                </div>
                <div class="modal-footer d-flex justify-content-center">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler l'envoi</button>
                    <button type="submit" class="btn btn-outline-secondary" data-bs-dismiss="modal">Envoyer</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const modalElement = document.getElementById("modalCredentials");
            if(modalElement){
                const modal = new bootstrap.Modal(modalElement, {
                    backdrop: 'static',
                    keyboard: false
                });
                modal.show();
            }
        });
    </script>
</th:block>

<th:block th:fragment="modal-error">
    <div class="modal fade" id="modalError" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header text-bg-danger rounded-top-4">
                    <h5 class="modal-title"><i class="bi bi-x-octagon me-2"></i>Erreur</h5>
                </div>
                <div class="modal-body p-3">
                    <h4 class="text-center" th:text="${submitState}"></h4>
                </div>
                <div class="modal-footer d-flex justify-content-center">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Terminer</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const modalElement = document.getElementById("modalError");
            if(modalElement){
                const modal = new bootstrap.Modal(modalElement, {
                    backdrop: 'static',
                    keyboard: false
                });
                modal.show();
            }
        });
    </script>
</th:block>

</body>
</html>
