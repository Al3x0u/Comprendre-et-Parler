<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="profile">

    <!-- Profile Header -->
    <div class="card border-0 shadow-sm mb-4 rounded-4" th:object="${beneficiaire}">
        <div class="card-body bg-primary text-white rounded-4 p-4">
            <div class="row align-items-center g-4">

                <div class="col-12 col-md-auto text-center">
                    <img th:src="@{/images/avatar_02.png}" alt="Avatar" class="profile-avatar rounded-circle border border-4 border-white shadow">
                </div>

                <div class="col-12 col-md">
                    <p class="text-white-50 mb-1">Profil bénéficiaire</p>
                    <h1 class="h2 mb-1" th:text="*{firstName + ' ' + lastName}"></h1>
                    <p class="fw-semibold mb-1" th:text="*{login}"></p>
                    <p class="mb-3">
                        <i class="bi bi-cake2-fill me-2"></i>
                        <span th:text="${#temporals.format(beneficiaire.birthDate, 'dd/MM/yyyy')}"></span>
                        <span class="text-white-50 ms-2" th:text="'(' + ${age} + ' ans)'"></span>
                    </p>
                    <a th:if="${isManager or isOwnProfile}" th:href="@{/beneficiaires/profil/{id}/modifier(id=${beneficiaire.id})}"
                       class="btn btn-light btn-lg text-primary fw-semibold">
                        <i class="bi bi-pencil-fill me-2"></i>Modifier le profil
                    </a>
                </div>

            </div>
        </div>
    </div>

    <div class="row g-4" th:object="${beneficiaire}">

        <div class="col-12 col-lg-8">

            <!-- Contact -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <h2 class="h5 text-primary mb-4">Informations de contact</h2>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <div class="bg-light rounded p-3 h-100">
                                <p class="text-secondary fw-bold small mb-1"><i class="bi bi-envelope-fill me-2"></i>Adresse mail</p>
                                <p class="mb-0" th:text="*{email}"></p>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="bg-light rounded p-3 h-100">
                                <p class="text-secondary fw-bold small mb-1"><i class="bi bi-telephone-fill me-2"></i>Téléphone</p>
                                <p th:if="*{phoneNumber != null}" class="mb-0" th:text="*{phoneNumber}"></p>
                                <p th:unless="*{phoneNumber != null}" class="text-muted mb-0">Aucun numéro renseigné</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Referent Interpreter -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                        <h2 class="h5 text-primary mb-0">Interprète de référence</h2>
                        <div class="d-flex">
                            <button class="btn btn-outline-danger btn-sm rounded-4 d-none me-1" id="btn-cancel-interpreter" onclick="toggleEditInterpreter()">
                                <i class="bi bi-x me-1"></i>Annuler
                            </button>
                            <button th:if="${isManager}" class="btn btn-outline-primary btn-sm rounded-4" id="btn-edit-interpreter" onclick="toggleEditInterpreter()">
                                <i class="bi bi-pencil me-1"></i>Modifier
                            </button>
                        </div>
                    </div>

                    <!-- Vue normale -->
                    <div id="interpreter-view" th:if="*{interpreterRef != null}" class="bg-light rounded p-3 d-flex align-items-center gap-3">
                        <a th:href="@{/interpretes/profil/{id}(id=${beneficiaire.interpreterRef.id})}">
                            <img th:src="@{/images/avatar.png}" alt="Avatar" width="40" height="40" class="rounded-circle border">
                        </a>
                        <div>
                            <a th:href="@{/interpretes/profil/{id}(id=${beneficiaire.interpreterRef.id})}"
                               class="fw-semibold text-primary text-decoration-none"
                               th:text="*{interpreterRef.firstName + ' ' + interpreterRef.lastName}"></a>
                            <p class="text-muted small mb-0" th:text="*{interpreterRef.login}"></p>
                        </div>
                    </div>

                    <!-- Vue édition -->
                    <form id="form-interpreter" th:action="@{/beneficiaires/profil/{id}/modifier-interprete(id=${beneficiaire.id})}" method="post">
                        <div id="interpreter-edit" class="d-none">
                            <div class="dropdown">
                                <button class="btn btn-outline-secondary dropdown-toggle w-100 d-flex align-items-center gap-2"
                                        type="button" id="interpreter-dropdown" data-bs-toggle="dropdown">
                                    <img src="/images/avatar.png" width="30" height="30" class="rounded-circle border" id="selected-avatar">
                                    <span id="selected-name">Choisir un interprète</span>
                                </button>
                                <ul class="dropdown-menu w-100" style="max-height: 300px; overflow-y: auto;">
                                    <li th:each="i : ${interpreters}">
                                        <a class="dropdown-item d-flex align-items-center gap-3 py-2 interpreter-option"
                                           href="#"
                                           th:data-name="${i.firstName + ' ' + i.lastName}"
                                           th:data-id="${i.id}">
                                            <img th:src="@{/images/avatar.png}" width="35" height="35" class="rounded-circle border">
                                            <div>
                                                <p class="fw-semibold mb-0" th:text="${i.firstName + ' ' + i.lastName}"></p>
                                                <p class="text-muted small mb-0" th:text="${i.login}"></p>
                                            </div>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                            <input type="hidden" id="selected-interpreter-id" name="interpreterRefId">
                        </div>
                    </form>

                    <p th:unless="*{interpreterRef != null}" class="text-muted mb-0">Aucun interprète assigné</p>
                </div>
            </div>

        </div>

        <div class="col-12 col-lg-4">

            <!-- Status -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="h5 text-primary mb-0">Statut</h2>
                        <div class="d-flex">
                            <button class="btn btn-outline-danger btn-sm rounded-4 d-none me-1" id="btn-cancel-status" onclick="toggleEditStatus()">
                                <i class="bi bi-x me-1"></i>Annuler
                            </button>
                            <button th:if="${isManager}" class="btn btn-outline-primary btn-sm rounded-4" id="btn-edit-status" onclick="toggleEditStatus()">
                                <i class="bi bi-pencil me-1"></i>Modifier
                            </button>
                        </div>
                    </div>

                    <!-- Vue normale -->
                    <div id="status-view" class="bg-light rounded p-3">
                        <p class="fw-semibold mb-1" th:text="*{status.designation}"></p>
                        <p class="text-muted small mb-0" th:text="'Quota : ' + *{status.hourQuota} + 'h/an'"></p>
                    </div>

                    <!-- Vue édition -->
                    <form id="form-status" th:action="@{/beneficiaires/profil/{id}/modifier-status(id=${beneficiaire.id})}" method="post">
                        <div id="status-edit" class="d-none">
                            <select name="statusId" class="form-select">
                                <option th:each="s : ${allStatuses}"
                                        th:value="${s.id}"
                                        th:text="${s.designation}"></option>
                            </select>
                        </div>
                    </form>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
