<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Liste des interprètes</title>
  <link rel="stylesheet" th:href="@{css/bootstrap.min.css}">
</head>
<body class="bg-body-tertiary">

<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h1 class="h3 mb-0">Liste des interprètes</h1>
    </div>

    <div class="list-group list-group-flush">
      <div class="list-group-item d-flex justify-content-between align-items-center" th:each="interprete : ${interpretes}">
        <div>
          <div class="fw-bold text-primary" th:text="${interprete.login}"></div>
          <div th:text="${interprete.firstName + ' ' + interprete.lastName}"></div>
        </div>

        <a th:href="@{/interpreters/profile/{id}(id=${interprete.id})}"  class="btn btn-primary btn-sm">
          Voir le profil
        </a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
