<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des interprètes</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <style>
    .page-header {
      background: linear-gradient(135deg, #0d6efd, #6ea8fe);
      color: white;
      border-radius: 1rem;
    }

    .interpreter-card {
      border: 0;
      border-radius: 1rem;
      box-shadow: 0 .125rem .5rem rgba(0,0,0,.08);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .interpreter-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 .5rem 1rem rgba(0,0,0,.12);
    }

    .avatar {
      width: 56px;
      height: 56px;
      object-fit: cover;
    }

    .profile-btn {
      min-height: 44px;
    }
  </style>
</head>
<body class="bg-body-tertiary">

<div th:replace="~{common/navbar :: navbar}"></div>

<main class="container py-4 py-md-5">
  <section class="page-header p-4 p-md-5 shadow-sm mb-4">
    <div class="d-flex flex-column gap-2">
      <span class="badge text-bg-light text-primary align-self-start">Responsable</span>
      <h1 class="h3 h2-md mb-0">Liste des interprètes</h1>

    </div>
  </section>

  <section class="row g-3" th:if="${interpretes != null and !#lists.isEmpty(interpretes)}">
    <div class="col-12" th:each="interprete : ${interpretes}">
      <article class="card interpreter-card">
        <div class="card-body p-3 p-md-4">
          <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-sm-between gap-3">
            <div class="d-flex align-items-center gap-3">
              <img th:src="@{/images/avatar.png}" alt="Avatar interprète" class="avatar rounded-circle border">
              <div>
                <div class="fw-bold text-primary fs-5" th:text="${interprete.login}"></div>
                <div class="text-body-secondary" th:text="${interprete.firstName + ' ' + interprete.lastName}"></div>
              </div>
            </div>

            <a th:href="@{/interpreters/profile/{id}(id=${interprete.id})}"
               class="btn btn-primary profile-btn px-4 w-100 w-sm-auto">
              Voir le profil
            </a>
          </div>
        </div>
      </article>
    </div>
  </section>

  <div class="alert alert-info shadow-sm" th:if="${interpretes == null or #lists.isEmpty(interpretes)}">
    Aucun interprète à afficher.
  </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
