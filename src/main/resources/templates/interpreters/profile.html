<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(#{website.name})}"></head>
<body>

<div th:replace="~{common/navbar :: navbar}"></div>

<main class="container py-4">

  <div class="mb-3" th:if="${referer != null}">
    <a th:href="@{/interpretes}" class="btn btn-outline-secondary btn-lg">
      <i class="bi bi-arrow-left me-2"></i>Retour
    </a>
  </div>

  <div th:replace="~{common/profile-interpreter :: profile}"></div>

</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
  //TODO toggleEditSkills est défini en double, ici et dans profile.html
  function toggleEditUnavailability() {
    const btn = document.getElementById('btn-edit-unavailability');
    const modifyButtons = document.querySelectorAll('.unavailability-modify');
    const deleteButtons = document.querySelectorAll('.unavailability-delete');
    const addButton = document.getElementById('btn-add-unavailability');
    const isEditing = btn.classList.contains('editing');

    if (isEditing) {
      btn.innerHTML = '<i class="bi bi-pencil me-1"></i>Modifier';
      btn.classList.remove('editing', 'btn-outline-danger');
      btn.classList.add('btn-outline-primary');
      modifyButtons.forEach(b => b.classList.add('d-none'));
      deleteButtons.forEach(b => b.classList.add('d-none'));
      addButton.classList.add('d-none');
    } else {
      btn.innerHTML = '<i class="bi bi-x me-1"></i>Annuler';
      btn.classList.add('editing', 'btn-outline-danger');
      btn.classList.remove('btn-outline-primary');
      modifyButtons.forEach(b => b.classList.remove('d-none'));
      deleteButtons.forEach(b => b.classList.remove('d-none'));
      addButton.classList.remove('d-none');
    }
  }

  function toggleEditSkills(type) {
    const btn = document.getElementById('btn-edit-' + type);
    const deleteIcons = document.querySelectorAll('.' + type + '-delete');
    const addButton = document.getElementById('btn-add-' + type);
    const isEditing = btn.classList.contains('editing');

    if (isEditing) {
      btn.innerHTML = '<i class="bi bi-pencil me-1"></i>Modifier';
      btn.classList.remove('editing', 'btn-outline-danger');
      btn.classList.add('btn-outline-primary');
      deleteIcons.forEach(i => i.classList.add('d-none'));
      addButton.classList.add('d-none');
    } else {
      btn.innerHTML = '<i class="bi bi-x me-1"></i>Annuler';
      btn.classList.add('editing', 'btn-outline-danger');
      btn.classList.remove('btn-outline-primary');
      deleteIcons.forEach(i => i.classList.remove('d-none'));
      addButton.classList.remove('d-none');
    }
  }
</script>
</body>
</html>
