<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Profil interprète</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

</head>
<body class="bg-body-tertiary">

<div class="container py-4">
  <div class="mb-3">
    <a th:href="@{/interpreters}" class="btn btn-outline-secondary btn-sm">
      Retour à la liste
    </a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white">
      <h1 class="h3 mb-0">Profil de l'interprète</h1>
    </div>

    <div class="card-body" th:object="${interprete}">
      <h2 class="h4 text-primary mb-1" th:text="*{login}"></h2>
      <p class="fw-semibold mb-4" th:text="*{firstName + ' ' + lastName}"></p>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <div class="border rounded p-3 bg-light">
            <div class="fw-bold">Adresse mail</div>
            <div th:text="*{email}"></div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="border rounded p-3 bg-light">
            <div class="fw-bold">Téléphone</div>
            <div th:text="*{phoneNumber}"></div>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <div class="border rounded p-3 bg-light">
          <div class="fw-bold mb-2">Localisation</div>
          <div th:if="*{location != null}">
            <div th:text="*{location.designation}"></div>
            <div th:text="*{location.street + ' ' + location.streetNumber}"></div>
            <div th:text="*{location.city.postalCode + ' ' + location.city.designation}"></div>
          </div>
          <div th:unless="*{location != null}" class="text-muted">
            Aucune localisation renseignée
          </div>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-8">
          <div class="border rounded p-3 bg-light h-100">
            <div class="fw-bold mb-2">Compétences</div>

            <div class="mb-2">
              <span class="fw-semibold">Académiques :</span>
              <span th:if="*{academicSkills != null and !#sets.isEmpty(academicSkills)}">
                                <span th:each="skill : *{academicSkills}"
                                      class="badge bg-secondary me-1 mb-1"
                                      th:text="${skill.designation}"></span>
                            </span>
              <span th:unless="*{academicSkills != null and !#sets.isEmpty(academicSkills)}"
                    class="text-muted">Aucune</span>
            </div>

            <div>
              <span class="fw-semibold">Métier :</span>
              <span th:if="*{jobSkills != null and !#sets.isEmpty(jobSkills)}">
                                <span th:each="skill : *{jobSkills}"
                                      class="badge bg-dark me-1 mb-1"
                                      th:text="${skill.designation}"></span>
                            </span>
              <span th:unless="*{jobSkills != null and !#sets.isEmpty(jobSkills)}"
                    class="text-muted">Aucune</span>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="border rounded p-3 bg-light h-100">
            <div class="fw-bold mb-2">Transport</div>
            <div th:text="*{transportMode}"></div>
          </div>
        </div>
      </div>

      <div>
        <div class="border rounded p-3 bg-light">
          <div class="fw-bold mb-2">Indisponibilités</div>
          <ul class="mb-0" th:if="*{unavailability != null and !#sets.isEmpty(unavailability)}">
            <li th:each="u : *{unavailability}">
              <span th:text="${u.reason}"></span>
            </li>
          </ul>
          <div th:unless="*{unavailability != null and !#sets.isEmpty(unavailability)}"
               class="text-muted">
            Aucune indisponibilité renseignée
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
