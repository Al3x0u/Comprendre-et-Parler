<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(#{website.name})}"></head>

<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<main class="container py-4">
    <div class="card border-0 rounded-4 shadow-sm">
        <div class="card-header rounded-top-4 bg-primary text-white p-3">
            <h1 class="h3 mb-0 py-1"><i class="bi bi-person-plus-fill me-2"></i>Créer un interprète</h1>
        </div>

        <div>
            <form class="p-2" th:action="@{/interpretes/creation}" th:object="${interpreterToCreate}" method="post">
                <div class="creation-user" style="width: 75%">
                    <div class="d-flex flex-column flex-lg-row">
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="lastname">Nom&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                            <input class="col-7 ms-2" type="text" name="lastname" id="lastname" th:field="*{lastName}" required />
                        </div>
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="firstname">Prénom&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                            <input class="col-7 ms-2" type="text" name="firstname" id="firstname" th:field="*{firstName}" required />
                        </div>
                    </div>
                    <div class="d-flex flex-column flex-lg-row">
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="email"><i class="bi bi-envelope-fill me-2"></i>Mail&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                            <input class="col-7 ms-2" type="email" name="email" id="email" th:field="*{email}" required />
                        </div>
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="phone"><i class="bi bi-telephone-fill me-2"></i>Téléphone&nbsp;: </label>
                            <input class="col-7 ms-2" type="tel" name="phone" id="phone"
                                   pattern="[0-9]+\/[0-9]+\.[0-9]+\.[0-9]+" placeholder="xxxx/xx.xx.xx" th:field="*{phoneNumber}" />
                        </div>
                    </div>
                    <div class="d-flex flex-column flex-lg-row">
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="password">Mot de passe&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                            <input class="col-7 ms-2" type="password" name="password" id="password" autocomplete="new-password" th:field="*{hashedPassword}" required />
                        </div>
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="birthdate"><i class="bi bi-cake2-fill me-2"></i>Naissance&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                            <input class="col-7 ms-2" type="date" name="birthdate" id="birthdate" th:field="*{birthDate}" required />
                        </div>
                    </div>
                    <div>
                        <div class="d-flex justify-content-end m-2 col-lg-6">
                            <label class="d-flex justify-content-end col-5" for="transportMode"><i class="bi bi-car-front-fill me-2"></i>Mobilité&nbsp;: </label>
                            <input class="col-7 ms-2" type="text" name="transportMode" id="transportMode" th:field="*{transportMode}" />
                        </div>
                    </div>
                </div>

                <hr>
                <div class="creation-user">
                    <h3 class="text-primary"><i class="bi bi-geo-alt-fill me-2"></i>Localisation</h3>
                    <div style="width: 75%">
                        <div class="d-flex flex-column flex-lg-row">
                            <div class="d-flex justify-content-end m-2 col-lg-6">
                                <label class="d-flex justify-content-end col-5" for="postalCode">Code postal&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                                <input class="col-7 ms-2" type="number" name="postalCode" id="postalCode" min="1000" max ="9999" value="1000" th:field="*{location.city.postalCode}" required />
                            </div>
                            <div class="d-flex justify-content-end m-2 col-lg-6">
                                <label class="d-flex justify-content-end col-5" for="city">Ville&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                                <input class="col-7 ms-2" type="text" name="city" id="city" th:field="*{location.city.designation}" required />
                            </div>
                        </div>
                        <div class="d-flex flex-column flex-lg-row">
                            <div class="d-flex justify-content-end m-2 col-lg-6">
                                <label class="d-flex justify-content-end col-5" for="street">Rue&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                                <input class="col-7 ms-2" type="text" name="street" id="street" th:field="*{location.street}" required />
                            </div>
                            <div class="d-flex justify-content-end m-2 col-lg-6">
                                <label class="d-flex justify-content-end col-5" for="streetNumber">Numéro&nbsp;: </label>
                                <input class="col-7 ms-2" type="text" name="streetNumber" id="streetNumber" th:field="*{location.streetNumber}" />
                            </div>
                        </div>
                        <div class="d-flex flex-column flex-lg-row">
                            <div class="d-flex justify-content-end m-2 col-lg-6">
                                <label class="d-flex justify-content-end col-5" for="designation">Désignation&nbsp;: </label>
                                <input class="col-7 ms-2" type="text" name="designation" id="designation" th:field="*{location.designation}" />
                            </div>
                            <div class="d-flex justify-content-end m-2 col-lg-6">
                                <label class="d-flex justify-content-end col-5" for="box">Boite&nbsp;: </label>
                                <input class="col-7 ms-2" type="number" name="box" id="box" min="0" value="0" th:field="*{location.box}" />
                            </div>
                        </div>
                    </div>
                </div>

                <hr>
                <div class="creation-user">
                    <h3 class="text-primary">Quotas</h3>
                    <div style="width: 75%">
                        <div class="d-flex flex-column flex-lg-row">
                            <div class="d-flex justify-content-end m-2 col-lg-6">
                                <label class="d-flex justify-content-end col-5" for="weekHourlyQuota">Hebdomadaire&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                                <input class="col-7 ms-2" type="number" name="weekHourlyQuota" id="weekHourlyQuota" min="0" value="0" th:field="*{hourQuotaWeek}" required />
                            </div>
                            <div class="d-flex justify-content-end m-2 col-lg-6">
                                <label class="d-flex justify-content-end col-5" for="yearHourlyQuota">Annuel&nbsp;<p class="d-inline text-danger m-0">*</p>&nbsp;: </label>
                                <input class="col-7 ms-2" type="number" name="yearHourlyQuota" id="yearHourlyQuota" min="0" value="0" th:field="*{hourQuotaYear}" required />
                            </div>
                        </div>
                    </div>
                </div>

                <hr>
                <div>
                    <h3 class="creation-user text-primary">Compétences</h3>
                    <div>
                        <div class="d-flex flex-column flex-lg-row">
                            <div class="d-flex flex-column justify-content-between align-items-center m-2 col-lg-6">
                                <h2 class="h5 mb-0">Académiques</h2>
                                <div th:if="*{academicSkills != null and !#sets.isEmpty(academicSkills)}" class="d-flex flex-wrap gap-2" id="academic-skills">
                                    <span th:each="skill : *{academicSkills}" class="badge bg-secondary fs-6 px-3 py-2 rounded-pill d-flex align-items-center gap-2">
                                        <span th:text="${skill.designation}"></span>
                                        <i class="bi bi-x skill-delete academic-delete d-none" style="cursor:pointer"></i>
                                    </span>
                                </div>
                                <button type="button" class="btn btn-outline-primary btn-sm mt-3" id="btn-add-academic"
                                        data-bs-toggle="modal" data-bs-target="#modalAddAcademic">
                                    <i class="bi bi-plus-lg me-1"></i>Ajouter
                                </button>
                            </div>
                            <div class="d-flex flex-column justify-content-between align-items-center m-2 col-lg-6">
                                <h2 class="h5 mb-0">Métiers</h2>
                                <div th:if="*{jobSkills != null and !#sets.isEmpty(jobSkills)}" class="d-flex flex-wrap gap-2" id="job-skills">
                                    <span th:each="skill : *{jobSkills}" class="badge bg-dark fs-6 px-3 py-2 rounded-pill d-flex align-items-center gap-2">
                                        <span th:text="${skill.designation}"></span>
                                        <i class="bi bi-x skill-delete job-delete d-none" style="cursor:pointer"></i>
                                    </span>
                                </div>
                                <button class="btn btn-outline-primary btn-sm mt-3" id="btn-add-job"
                                        data-bs-toggle="modal" data-bs-target="#modalAddJob">
                                    <i class="bi bi-plus-lg me-1"></i>Ajouter
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <hr>
                <div class="d-grid d-md-flex justify-content-md-center gap-2">
                    <button type="submit" class="btn btn-primary btn-lg"><i class="bi-floppy-fill me-2"></i>Créer</button>
                    <a th:href="@{/interpretes}"
                       class="btn btn-outline-secondary btn-lg">Annuler</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Add Academic Skill -->
    <div class="modal fade" id="modalAddAcademic" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header text-bg-primary rounded-top-4">
                    <h5 class="modal-title"><i class="bi bi-mortarboard me-2"></i>Ajouter une compétence académique</h5>
                </div>
                <div class="modal-body">
                    <form id="academic-add-form"
                          th:action="@{/interpretes/creation/competences/academiques/ajouter}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label">Choisir une compétence existante</label>
                            <select class="form-select" name="existingSkillId" id="existing-academic">
                                <option value="">-- Sélectionner --</option>
                                <option th:each="skill : ${allAcademicSkills}"
                                        th:value="${skill.id}"
                                        th:text="${skill.designation}"></option>
                            </select>
                        </div>

                        <div class="text-center text-muted my-3">— ou —</div>

                        <div class="mb-3">
                            <label for="new-academic" class="form-label">Créer une nouvelle compétence</label>
                            <input id="new-academic" type="text" class="form-control"
                                   name="newSkillName" placeholder="Nom de la compétence">
                        </div>

                    </form>
                </div>
                <div class="modal-footer rounded-bottom-4">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" form="academic-add-form" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-2"></i>Ajouter
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Add Job Skill -->
    <div class="modal fade" id="modalAddJob" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header text-bg-primary rounded-top-4">
                    <h5 class="modal-title"><i class="bi bi-briefcase me-2"></i>Ajouter une compétence métier</h5>
                </div>
                <div class="modal-body">
                    <form id="job-add-form"
                          th:action="@{/interpretes/creation/competences/metier/ajouter}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label">Choisir une compétence existante</label>
                            <select class="form-select" name="existingSkillId" id="existing-job">
                                <option value="">-- Sélectionner --</option>
                                <option th:each="skill : ${allJobSkills}"
                                        th:value="${skill.id}"
                                        th:text="${skill.designation}"></option>
                            </select>
                        </div>

                        <div class="text-center text-muted my-3">— ou —</div>

                        <div class="mb-3">
                            <label for="new-job" class="form-label">Créer une nouvelle compétence</label>
                            <input id="new-job" type="text" class="form-control"
                                   name="newSkillName" placeholder="Nom de la compétence">
                        </div>

                    </form>
                </div>
                <div class="modal-footer rounded-bottom-4">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" form="job-add-form" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-2"></i>Ajouter
                    </button>
                </div>

            </div>
        </div>
    </div>
</main>

<script>
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');

    document.getElementById('birthdate').setAttribute('max', `${year}-${month}-${day}`);
</script>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
