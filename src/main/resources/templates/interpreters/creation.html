<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(#{website.name})}"></head>

<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<main class="container py-4">
    <div th:if="${submitState != null}">
        <div th:if="${submitState == 'success'}">
            <div th:replace="~{common/modals :: modal-success}"></div>
        </div>
        <div th:unless="${submitState == 'success'}">
            <div th:replace="~{common/modals :: modal-error(${submitState})}"></div>
        </div>
    </div>

    <div class="card border-0 rounded-4 shadow-sm">
        <div class="card-header rounded-top-4 bg-primary text-white p-3">
            <h1 class="h3 mb-0 py-1"><i class="bi bi-person-plus-fill me-2"></i>Créer un interprète</h1>
        </div>

        <div class="card-body p-5">
            <form name="creation-user" id="creation-interpreter" th:action="@{/interpretes/creer}"
                  th:object="${interpreterForm}" method="post">

                <!-- Last name / First name -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="lastname" class="form-label">Nom&nbsp;<span class="text-danger">*</span></label>
                        <input id="lastname" type="text" class="form-control" name="lastname" th:field="*{lastName}" required />
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="firstname" class="form-label">Prénom&nbsp;<span class="text-danger">*</span></label>
                        <input id="firstname" type="text" class="form-control" name="firstname" th:field="*{firstName}" required />
                    </div>
                </div>

                <!-- Email / Phone -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="email" class="form-label"><i class="bi bi-envelope-fill me-2"></i>Mail&nbsp;<span class="text-danger">*</span></label>
                        <input id="email" type="email" class="form-control" name="email" th:field="*{email}" required />
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="phone" class="form-label"><i class="bi bi-telephone-fill me-2"></i>Téléphone</label>
                        <input id="phone" type="tel" class="form-control" name="phone"
                               pattern="[0-9]+\/[0-9]+\.[0-9]+\.[0-9]+" placeholder="xxxx/xx.xx.xx" th:field="*{phoneNumber}" />
                    </div>
                </div>

                <!-- Password / BirthDate -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="password" class="form-label"><i class="bi bi-lock-fill me-2"></i>Mot de passe&nbsp;<span class="text-danger">*</span></label>
                        <input id="password" type="password" class="form-control" name="password" autocomplete="new-password" th:field="*{password}" minlength="6" required />
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="birthdate" class="form-label"><i class="bi bi-cake2-fill me-2"></i>Naissance&nbsp;<span class="text-danger">*</span></label>
                        <input id="birthdate" type="date" class="form-control" name="birthdate" th:value="*{birthDate != null}? *{birthDate} : ''"
                               th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required />
                    </div>
                </div>

                <!-- Transport mode -->
                <div class="col-12 col-md-6 mb-4">
                    <label for="transportMode" class="form-label"><i class="bi bi-car-front-fill me-2"></i>Mobilité</label>
                    <input id="transportMode" type="text" class="form-control" name="transportMode" th:field="*{transportMode}" />
                </div>

                <hr class="my-4">
                <h2 class="h5 text-primary mb-3"><i class="bi bi-geo-alt-fill me-2"></i>Localisation</h2>

                <!-- Designation / Street / Street number / Box -->
                <div class="row g-3 mb-4">
                    <div class="col-12">
                        <label for="designation" class="form-label">Désignation</label>
                        <input id="designation" type="text" class="form-control" th:field="*{locationDesignation}" />
                    </div>
                    <div class="col-12 col-md-8">
                        <label for="street" class="form-label">Rue&nbsp;<span class="text-danger">*</span></label>
                        <input id="street" type="text" class="form-control" name="street" th:field="*{street}" required />
                    </div>
                    <div class="col-12 col-md-2">
                        <label for="streetNumber" class="form-label">Numéro</label>
                        <input id="streetNumber" type="text" class="form-control" name="streetNumber" th:field="*{streetNumber}" />
                    </div>
                    <div class="col-12 col-md-2">
                        <label for="box" class="form-label">Boîte</label>
                        <input id="box" type="number" min="0" class="form-control" name="box" th:field="*{box}" />
                    </div>
                </div>

                <!-- City -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="cityId" class="form-label">Ville&nbsp;<span class="text-danger">*</span></label>
                        <select id="cityId" class="form-select" name="cityId" required>
                            <option th:if="*{cityId == 0}" value="">-- Sélectionner --</option>
                            <option th:each="city : ${allCities}"
                                    th:value="${city.id}"
                                    th:text="${city.postalCode + ' - ' + city.designation}"
                                    th:selected="${city.id == interpreterForm.cityId}">
                            </option>
                        </select>
                    </div>
                </div>

                <hr class="my-4">
                <h5 class="text-primary mb-3">Quotas</h5>

                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="weekHourlyQuota" class="form-label">Hebdomadaire&nbsp;<span class="text-danger">*</span></label>
                        <input id="weekHourlyQuota" type="number" class="form-control" name="weekHourlyQuota" min="0" value="0" th:field="*{hourQuotaWeek}" required />
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="yearHourlyQuota" class="form-label">Annuel&nbsp;<span class="text-danger">*</span></label>
                        <input id="yearHourlyQuota" type="number" class="form-control" name="yearHourlyQuota" min="0" value="0" th:field="*{hourQuotaYear}" required />
                    </div>
                </div>

                <hr class="my-4">
                <h5 class="text-primary mb-3">Compétences</h5>

                <div class="row mb-4">
                    <div class="col-12 col-lg-6 mb-4">
                        <h3 class="h6 mb-3">Métiers</h3>
                        <fieldset id="chosen-job" class="d-flex flex-wrap gap-2">
                            <div class="form-check col-12 col-sm-5 col-xl-4" th:each="skill : ${allJobSkills}">
                                <input class="form-check-input" type="checkbox" th:id="${skill.designation}" th:name="${skill.designation}"
                                       th:field="*{jobSkillList}" th:value="${skill.designation}" />
                                <label class="form-check-label" th:for="${skill.designation}" th:text="${skill.designation}"></label>
                            </div>
                        </fieldset>
                    </div>
                    <div class="col-12 col-lg-6 mb-4">
                        <h3 class="h6 mb-3">Académiques</h3>
                        <fieldset id="chosen-academic" class="d-flex flex-wrap gap-2">
                            <div class="form-check col-12 col-sm-5 col-xl-4" th:each="skill : ${allAcademicSkills}">
                                <input class="form-check-input" type="checkbox" th:id="${skill.designation}" th:name="${skill.designation}"
                                       th:field="*{academicSkillList}" th:value="${skill.designation}" />
                                <label class="form-check-label" th:for="${skill.designation}" th:text="${skill.designation}"></label>
                            </div>
                        </fieldset>
                    </div>
                </div>

                <hr class="my-4">
                <div class="d-grid d-md-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-lg"><i class="bi-floppy-fill me-2"></i>Créer</button>
                    <a th:href="@{/interpretes}" class="btn btn-outline-secondary btn-lg">Annuler</a>
                </div>

            </form>
        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
